<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollen — Job Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0C;
  --surface: #131316;
  --surface2: #1A1A1F;
  --surface3: #222228;
  --border: #2A2A32;
  --border2: #36363F;
  --text: #EDEDEF;
  --text2: #9494A0;
  --text3: #5E5E6E;
  --accent: #6EE7B7;
  --accent2: #34D399;
  --accentBg: rgba(110,231,183,0.08);
  --accentBorder: rgba(110,231,183,0.2);
  --blue: #60A5FA;
  --blueBg: rgba(96,165,250,0.1);
  --yellow: #FACC15;
  --yellowBg: rgba(250,204,21,0.1);
  --red: #F87171;
  --redBg: rgba(248,113,113,0.1);
  --green: #4ADE80;
  --greenBg: rgba(74,222,128,0.1);
  --purple: #C084FC;
  --purpleBg: rgba(192,132,252,0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
::selection { background: rgba(110,231,183,0.25); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
input, select, button { font-family: inherit; }

/* ── Layout ── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #059669);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.logo-sub { font-size: 10px; color: var(--text3); font-weight: 500; }

.tabs { display: flex; gap: 4px; }
.tab {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 500;
  background: transparent; color: var(--text2);
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s;
}
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { background: var(--accentBg); color: var(--accent); border-color: var(--accentBorder); }

.status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
.status-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

main { flex: 1; padding: 20px 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

/* ── Search ── */
.search-row { display: flex; gap: 10px; margin-bottom: 14px; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 0 14px; transition: border-color 0.15s;
}
.search-box:focus-within { border-color: var(--accentBorder); }
.search-box input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 14px; padding: 11px 0;
}
.search-box input::placeholder { color: var(--text3); }

.filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.pill {
  padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
  background: transparent; color: var(--text3);
  border: 1px solid var(--border); cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.pill:hover { border-color: var(--border2); color: var(--text2); }
.pill.active { background: var(--accentBg); color: var(--accent); border-color: var(--accentBorder); }
.pill-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }

.results-count { font-size: 12px; color: var(--text3); margin-bottom: 12px; }
.results-count span { color: var(--text); font-weight: 600; }

/* ── Job Cards ── */
.job-list { display: flex; flex-direction: column; gap: 6px; }
.job-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  padding: 15px 18px; cursor: pointer; transition: all 0.15s;
}
.job-card:hover { border-color: var(--border2); background: var(--surface2); }
.job-top { display: flex; gap: 12px; align-items: flex-start; }
.job-avatar {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff;
}
.job-info { flex: 1; min-width: 0; }
.job-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
.job-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.job-meta .remote { color: var(--green); font-size: 10px; font-weight: 600; margin-left: 6px; }
.job-tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.job-salary { font-size: 11px; color: var(--accent); font-weight: 500; }
.job-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: var(--surface3); color: var(--text2); font-weight: 500;
}
.job-time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.job-detail {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text2); line-height: 1.6;
}
.job-detail p { margin-bottom: 10px; max-height: 120px; overflow: hidden; }
.job-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.status-btn {
  padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
  background: transparent; color: var(--text3);
  border: 1px solid var(--border); cursor: pointer; text-transform: capitalize;
  font-family: 'DM Sans', sans-serif; transition: all 0.15s;
}
.status-btn:hover { border-color: var(--border2); color: var(--text2); }
.status-btn.active { background: var(--accentBg); color: var(--accent); border-color: var(--accentBorder); }
.job-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 500;
  margin-left: auto;
}
.job-link:hover { text-decoration: underline; }

/* ── Stats ── */
.stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; flex: 1; min-width: 150px;
}
.stat-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; font-family: 'Instrument Serif', Georgia, serif; }
.stat-sub { font-size: 11px; margin-top: 2px; font-weight: 500; }

/* ── Kanban ── */
.kanban { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 16px; }
.kanban-col { flex: 1; min-width: 210px; max-width: 260px; }
.kanban-header { display: flex; align-items: center; gap: 7px; padding: 0 4px; margin-bottom: 8px; }
.kanban-dot { width: 8px; height: 8px; border-radius: 50%; }
.kanban-label { font-size: 12px; font-weight: 600; }
.kanban-count {
  font-size: 10px; font-weight: 600; color: var(--text3);
  background: var(--surface3); border-radius: 4px; padding: 1px 6px;
}
.kanban-body {
  background: var(--surface2); border-radius: 10px; padding: 6px;
  border: 1px solid var(--border); min-height: 200px; max-height: 500px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 5px;
}
.kanban-body .job-card { padding: 10px 12px; }
.kanban-body .job-title { font-size: 12px; }
.kanban-body .job-meta { font-size: 11px; }
.kanban-empty { padding: 20px; text-align: center; color: var(--text3); font-size: 12px; }

/* ── Page Title ── */
.page-title { font-size: 20px; font-weight: 700; font-family: 'Instrument Serif', Georgia, serif; margin-bottom: 4px; }
.page-sub { font-size: 12px; color: var(--text3); margin-bottom: 18px; }

/* ── Source Table ── */
.source-table { width: 100%; border-collapse: collapse; }
.source-table th {
  text-align: left; font-size: 10px; color: var(--text3); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.source-table td {
  padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border);
}
.source-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
}
.source-badge.success { background: var(--greenBg); color: var(--green); }
.source-badge.error { background: var(--redBg); color: var(--red); }

/* ── Loading / Error ── */
.loading { text-align: center; padding: 60px; color: var(--text3); }
.loading-spinner {
  width: 28px; height: 28px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg {
  background: var(--redBg); border: 1px solid rgba(248,113,113,0.2);
  border-radius: 10px; padding: 16px 20px; color: var(--red); font-size: 13px;
}
.empty-state {
  text-align: center; padding: 60px; color: var(--text3);
  background: var(--surface); border-radius: 12px; border: 1px solid var(--border);
}
.empty-state .icon { font-size: 28px; opacity: 0.3; margin-bottom: 10px; }
.empty-state .title { font-size: 14px; font-weight: 500; }
.empty-state .sub { font-size: 12px; margin-top: 4px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease-out; }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🌸</div>
      <div>
        <div class="logo-text">Pollen</div>
        <div class="logo-sub">AI / Tech / Data PM Tracker</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="search" onclick="switchTab('search')">🔍 Search</button>
      <button class="tab" data-tab="kanban" onclick="switchTab('kanban')">📋 Pipeline</button>
      <button class="tab" data-tab="stats" onclick="switchTab('stats')">📊 Analytics</button>
      <button class="tab" data-tab="sources" onclick="switchTab('sources')">⚙️ Sources</button>
    </div>
    <div class="status-dot" id="statusDot">Loading...</div>
  </header>

  <main>
    <!-- SEARCH TAB -->
    <div id="tab-search" class="tab-content fade-in">
      <div class="search-row">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="Search roles, companies..." oninput="debounceSearch()">
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="results-count" id="resultsCount"></div>
      <div class="job-list" id="jobList"></div>
    </div>

    <!-- KANBAN TAB -->
    <div id="tab-kanban" class="tab-content fade-in" style="display:none;">
      <div class="page-title">Application Pipeline</div>
      <div class="page-sub">Drag jobs between columns or click to change status</div>
      <div class="kanban" id="kanbanBoard"></div>
    </div>

    <!-- STATS TAB -->
    <div id="tab-stats" class="tab-content fade-in" style="display:none;">
      <div class="page-title">Analytics</div>
      <div class="page-sub">Your job search at a glance</div>
      <div id="statsContent"></div>
    </div>

    <!-- SOURCES TAB -->
    <div id="tab-sources" class="tab-content fade-in" style="display:none;">
      <div class="page-title">Crawl Sources</div>
      <div class="page-sub">Status of each scraper run</div>
      <div id="sourcesContent"></div>
    </div>
  </main>
</div>

<script>
// ── Config ──
const API = 'http://localhost:8000';
let allJobs = [];
let filteredJobs = [];
let currentTab = 'search';
let activeFilters = { remote: false, location: '', level: '', source: '' };
let expandedJobId = null;
let searchTimeout = null;

const COLORS = ['#6EE7B7','#60A5FA','#FACC15','#F87171','#C084FC','#FB923C','#22D3EE','#A78BFA','#F472B6','#34D399'];
const KANBAN_COLS = [
  { key: 'new', label: 'New', color: '#9494A0' },
  { key: 'saved', label: 'Saved', color: '#C084FC' },
  { key: 'applied', label: 'Applied', color: '#60A5FA' },
  { key: 'interviewing', label: 'Interviewing', color: '#FACC15' },
  { key: 'offer', label: 'Offer', color: '#4ADE80' },
  { key: 'rejected', label: 'Rejected', color: '#F87171' },
];
const STATUSES = KANBAN_COLS.map(c => c.key);

function companyColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}

function daysAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return '1d ago';
  return diff + 'd ago';
}

function salaryStr(job) {
  if (job.salary_min && job.salary_max) return `$${Math.round(job.salary_min/1000)}k – $${Math.round(job.salary_max/1000)}k`;
  return '';
}

// ── API ──
async function fetchJobs() {
  try {
    const r = await fetch(`${API}/api/jobs?limit=200&order_by=newest`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    allJobs = data.jobs || [];
    document.getElementById('statusDot').textContent = `${allJobs.length} jobs loaded`;
    applyFilters();
    renderFilters();
  } catch (e) {
    document.getElementById('statusDot').textContent = 'API offline';
    document.getElementById('jobList').innerHTML = `
      <div class="error-msg">
        <strong>Cannot connect to API</strong><br>
        Make sure the server is running: <code>uvicorn api.server:app --reload --port 8000</code>
      </div>`;
  }
}

async function fetchStats() {
  try {
    const r = await fetch(`${API}/api/stats`);
    return await r.json();
  } catch { return null; }
}

async function fetchSources() {
  try {
    const r = await fetch(`${API}/api/sources`);
    return await r.json();
  } catch { return []; }
}

async function updateJobStatus(jobId, status) {
  try {
    await fetch(`${API}/api/jobs/${jobId}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    const job = allJobs.find(j => j.id === jobId);
    if (job) job.status = status;
    render();
  } catch (e) {
    console.error('Status update failed:', e);
  }
}

// ── Tabs ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = '';

  if (tab === 'kanban') renderKanban();
  if (tab === 'stats') renderStats();
  if (tab === 'sources') renderSources();
}

// ── Filters ──
function renderFilters() {
  const locations = [...new Set(allJobs.map(j => j.location).filter(Boolean))].slice(0, 6);
  const levels = [...new Set(allJobs.map(j => j.level).filter(Boolean))];
  const sources = [...new Set(allJobs.map(j => j.source).filter(Boolean))];

  let html = '';
  html += `<button class="pill ${activeFilters.remote ? 'active' : ''}" onclick="toggleFilter('remote')">🌍 Remote</button>`;
  locations.forEach(loc => {
    html += `<button class="pill ${activeFilters.location === loc ? 'active' : ''}" onclick="toggleFilter('location','${loc.replace(/'/g,"\\'")}')">${loc}</button>`;
  });
  if (levels.length) {
    html += '<div class="pill-sep"></div>';
    levels.forEach(lv => {
      html += `<button class="pill ${activeFilters.level === lv ? 'active' : ''}" onclick="toggleFilter('level','${lv}')">${lv}</button>`;
    });
  }
  if (sources.length) {
    html += '<div class="pill-sep"></div>';
    sources.forEach(s => {
      html += `<button class="pill ${activeFilters.source === s ? 'active' : ''}" onclick="toggleFilter('source','${s}')">${s}</button>`;
    });
  }
  if (activeFilters.remote || activeFilters.location || activeFilters.level || activeFilters.source) {
    html += `<button style="font-size:11px;color:#F87171;background:none;border:none;cursor:pointer;font-weight:500;font-family:inherit;" onclick="clearFilters()">Clear all</button>`;
  }
  document.getElementById('filters').innerHTML = html;
}

function toggleFilter(key, value) {
  if (key === 'remote') activeFilters.remote = !activeFilters.remote;
  else activeFilters[key] = activeFilters[key] === value ? '' : value;
  applyFilters();
  renderFilters();
}

function clearFilters() {
  activeFilters = { remote: false, location: '', level: '', source: '' };
  applyFilters();
  renderFilters();
}

function applyFilters() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  filteredJobs = allJobs.filter(j => {
    if (q && !j.title.toLowerCase().includes(q) && !j.company_name.toLowerCase().includes(q)) return false;
    if (activeFilters.remote && !j.remote) return false;
    if (activeFilters.location && j.location !== activeFilters.location) return false;
    if (activeFilters.level && j.level !== activeFilters.level) return false;
    if (activeFilters.source && j.source !== activeFilters.source) return false;
    return true;
  });
  render();
}

function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => applyFilters(), 200);
}

// ── Render Jobs ──
function render() {
  const container = document.getElementById('jobList');
  document.getElementById('resultsCount').innerHTML = `Showing <span>${filteredJobs.length}</span> of ${allJobs.length} jobs`;

  if (filteredJobs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><div class="title">No jobs match your filters</div><div class="sub">Try adjusting your search criteria</div></div>`;
    return;
  }

  container.innerHTML = filteredJobs.slice(0, 50).map(job => {
    const color = companyColor(job.company_name);
    const initial = job.company_name.charAt(0);
    const salary = salaryStr(job);
    const expanded = expandedJobId === job.id;
    const tags = (job.tags || []);

    return `
    <div class="job-card" onclick="toggleExpand(${job.id})">
      <div class="job-top">
        <div class="job-avatar" style="background:${color}">${initial}</div>
        <div class="job-info">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div class="job-title">${esc(job.title)}</div>
              <div class="job-meta">
                ${esc(job.company_name)} · ${esc(job.location || 'Unknown')}
                ${job.remote ? '<span class="remote">REMOTE</span>' : ''}
              </div>
            </div>
            <div class="job-time">${daysAgo(job.first_seen_at)}</div>
          </div>
          <div class="job-tags">
            ${salary ? `<span class="job-salary">${salary}</span><span style="color:var(--text3);font-size:10px">·</span>` : ''}
            ${job.level ? `<span class="job-tag">${esc(job.level)}</span>` : ''}
            ${job.source ? `<span class="job-tag">${esc(job.source)}</span>` : ''}
            ${tags.map(t => `<span class="job-tag">${esc(t)}</span>`).join('')}
          </div>
        </div>
      </div>
      ${expanded ? `
      <div class="job-detail">
        <p>${esc((job.description || 'No description available.').substring(0, 500))}${(job.description || '').length > 500 ? '...' : ''}</p>
        <div class="job-actions">
          ${STATUSES.map(s => `<button class="status-btn ${job.status === s ? 'active' : ''}" onclick="event.stopPropagation(); updateJobStatus(${job.id}, '${s}')">${s}</button>`).join('')}
          <a class="job-link" href="${esc(job.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apply ↗</a>
        </div>
      </div>` : ''}
    </div>`;
  }).join('');

  if (filteredJobs.length > 50) {
    container.innerHTML += `<div style="text-align:center;padding:16px;font-size:12px;color:var(--text3)">Showing 50 of ${filteredJobs.length} — refine your search to see more</div>`;
  }
}

function toggleExpand(id) {
  expandedJobId = expandedJobId === id ? null : id;
  render();
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// ── Kanban ──
function renderKanban() {
  const board = document.getElementById('kanbanBoard');
  board.innerHTML = KANBAN_COLS.map(col => {
    const jobs = allJobs.filter(j => j.status === col.key);
    return `
    <div class="kanban-col"
      ondragover="event.preventDefault()" ondrop="kanbanDrop(event, '${col.key}')">
      <div class="kanban-header">
        <div class="kanban-dot" style="background:${col.color}"></div>
        <span class="kanban-label">${col.label}</span>
        <span class="kanban-count">${jobs.length}</span>
      </div>
      <div class="kanban-body">
        ${jobs.length === 0 ? '<div class="kanban-empty">Drop jobs here</div>' :
          jobs.slice(0, 20).map(job => {
            const color = companyColor(job.company_name);
            return `
            <div class="job-card" draggable="true" ondragstart="event.dataTransfer.setData('jobId','${job.id}')">
              <div class="job-top">
                <div class="job-avatar" style="background:${color};width:26px;height:26px;font-size:11px;border-radius:6px">${job.company_name.charAt(0)}</div>
                <div class="job-info">
                  <div class="job-title">${esc(job.title)}</div>
                  <div class="job-meta">${esc(job.company_name)} · ${esc(job.location || '')}</div>
                </div>
              </div>
            </div>`;
          }).join('')}
      </div>
    </div>`;
  }).join('');
}

function kanbanDrop(event, status) {
  event.preventDefault();
  const jobId = parseInt(event.dataTransfer.getData('jobId'));
  if (jobId) updateJobStatus(jobId, status).then(() => renderKanban());
}

// ── Stats ──
async function renderStats() {
  const el = document.getElementById('statsContent');
  el.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading analytics...</div>';

  const stats = await fetchStats();
  if (!stats) { el.innerHTML = '<div class="error-msg">Could not load stats</div>'; return; }

  const byStatus = stats.by_status || {};
  const bySource = stats.by_source || {};
  const topCompanies = stats.top_companies || [];

  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Jobs</div>
        <div class="stat-value">${stats.total || 0}</div>
        <div class="stat-sub" style="color:var(--accent)">+${stats.new_this_week || 0} this week</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Applied</div>
        <div class="stat-value" style="color:var(--blue)">${byStatus.applied || 0}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Interviewing</div>
        <div class="stat-value" style="color:var(--yellow)">${byStatus.interviewing || 0}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Offers</div>
        <div class="stat-value" style="color:var(--green)">${byStatus.offer || 0}</div>
      </div>
    </div>

    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div style="flex:1;min-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:14px;">Jobs by Source</div>
        ${Object.entries(bySource).map(([name, count], i) => `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div style="width:10px;height:10px;border-radius:3px;background:${COLORS[i % COLORS.length]}"></div>
            <span style="font-size:12px;flex:1;color:var(--text2)">${esc(name)}</span>
            <span style="font-size:12px;font-weight:600">${count}</span>
            <div style="width:80px;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(count / stats.total * 100)}%;background:${COLORS[i % COLORS.length]};border-radius:3px;"></div>
            </div>
          </div>
        `).join('')}
      </div>

      <div style="flex:1;min-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:14px;">Top Companies</div>
        ${topCompanies.slice(0, 10).map(c => `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div class="job-avatar" style="background:${companyColor(c.name)};width:24px;height:24px;font-size:10px;border-radius:6px">${c.name.charAt(0)}</div>
            <span style="font-size:12px;flex:1">${esc(c.name)}</span>
            <span style="font-size:11px;color:var(--text3)">${c.count} roles</span>
          </div>
        `).join('')}
      </div>

      <div style="flex:1;min-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:14px;">Pipeline Breakdown</div>
        ${KANBAN_COLS.map(col => {
          const count = byStatus[col.key] || 0;
          const pct = stats.total ? Math.round(count / stats.total * 100) : 0;
          return `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div style="width:10px;height:10px;border-radius:50%;background:${col.color}"></div>
            <span style="font-size:12px;flex:1;color:var(--text2)">${col.label}</span>
            <span style="font-size:12px;font-weight:600">${count}</span>
            <div style="width:80px;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;">
              <div style="height:100%;width:${pct}%;background:${col.color};border-radius:3px;"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

// ── Sources ──
async function renderSources() {
  const el = document.getElementById('sourcesContent');
  el.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading sources...</div>';

  const sources = await fetchSources();

  if (!sources.length) {
    el.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:12px;">
        <p style="font-size:13px;color:var(--text2);">No crawl logs yet. Run your first crawl:</p>
        <code style="display:block;margin-top:8px;padding:10px;background:var(--surface3);border-radius:6px;font-size:12px;color:var(--accent);">python run_crawl.py --source greenhouse</code>
      </div>`;
    return;
  }

  el.innerHTML = `
    <table class="source-table" style="margin-top:12px;">
      <thead><tr>
        <th>Source</th><th>Company</th><th>Status</th><th>Jobs Found</th><th>New</th><th>Time</th>
      </tr></thead>
      <tbody>
        ${sources.map(s => `
          <tr>
            <td>${esc(s.source)}</td>
            <td>${esc(s.company || '—')}</td>
            <td><span class="source-badge ${s.status === 'success' ? 'success' : 'error'}">${s.status}</span></td>
            <td>${s.jobs_found}</td>
            <td style="color:var(--accent);font-weight:600;">${s.jobs_new}</td>
            <td style="color:var(--text3);font-size:12px;">${s.started_at ? new Date(s.started_at).toLocaleString() : '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

// ── Init ──
fetchJobs();
</script>
</body>
</html>
