version: "3.9"

services:
  # PostgreSQL database (optional — remove to use SQLite)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pollen
      POSTGRES_USER: pollen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollen_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollen"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI REST server
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://pollen:${POSTGRES_PASSWORD:-pollen_dev}@db:5432/pollen
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000

  # Scheduler (runs crawls on interval)
  scheduler:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://pollen:${POSTGRES_PASSWORD:-pollen_dev}@db:5432/pollen
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    command: python run_scheduler.py

volumes:
  pgdata:
