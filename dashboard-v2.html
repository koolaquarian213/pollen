<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollen — Job Dashboard v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0C;
  --surface: #131316;
  --surface2: #1A1A1F;
  --surface3: #222228;
  --border: #2A2A32;
  --border2: #36363F;
  --text: #EDEDEF;
  --text2: #9494A0;
  --text3: #5E5E6E;
  --accent: #6EE7B7;
  --accent2: #34D399;
  --accentBg: rgba(110,231,183,0.08);
  --accentBorder: rgba(110,231,183,0.2);
  --blue: #60A5FA;
  --blueBg: rgba(96,165,250,0.1);
  --yellow: #FACC15;
  --yellowBg: rgba(250,204,21,0.1);
  --red: #F87171;
  --redBg: rgba(248,113,113,0.1);
  --green: #4ADE80;
  --greenBg: rgba(74,222,128,0.1);
  --purple: #C084FC;
  --purpleBg: rgba(192,132,252,0.1);
  --orange: #FB923C;
  --orangeBg: rgba(251,146,60,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
::selection { background: rgba(110,231,183,0.25); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
input, select, button, textarea { font-family: inherit; }

.app { display: flex; flex-direction: column; min-height: 100vh; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 8px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #059669); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.logo-sub { font-size: 10px; color: var(--text3); font-weight: 500; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  display: flex; align-items: center; gap: 5px; padding: 7px 13px; border-radius: 8px;
  font-size: 13px; font-weight: 500; background: transparent; color: var(--text2);
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s;
}
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { background: var(--accentBg); color: var(--accent); border-color: var(--accentBorder); }

.status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
.status-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

main { flex: 1; padding: 20px 24px; max-width: 1500px; margin: 0 auto; width: 100%; }

/* ── Resume Upload ── */
.resume-bar {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 14px;
}
.resume-bar label {
  font-size: 12px; font-weight: 600; color: var(--text2); white-space: nowrap;
}
.resume-upload-btn {
  padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
  background: var(--accentBg); color: var(--accent); border: 1px solid var(--accentBorder);
  cursor: pointer; transition: all 0.15s;
}
.resume-upload-btn:hover { background: rgba(110,231,183,0.15); }
.resume-name { font-size: 12px; color: var(--accent); font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume-status { font-size: 11px; color: var(--text3); margin-left: auto; }
.score-all-btn {
  padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
  background: var(--purpleBg); color: var(--purple); border: 1px solid rgba(192,132,252,0.2);
  cursor: pointer; transition: all 0.15s;
}
.score-all-btn:hover { background: rgba(192,132,252,0.15); }
.score-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Search ── */
.search-row { display: flex; gap: 10px; margin-bottom: 14px; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 0 14px; transition: border-color 0.15s;
}
.search-box:focus-within { border-color: var(--accentBorder); }
.search-box input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; padding: 11px 0; }
.search-box input::placeholder { color: var(--text3); }

.sort-select {
  padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500;
  background: var(--surface); color: var(--text2); border: 1px solid var(--border);
  cursor: pointer; outline: none;
}

.filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.pill {
  padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
  background: transparent; color: var(--text3); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.pill:hover { border-color: var(--border2); color: var(--text2); }
.pill.active { background: var(--accentBg); color: var(--accent); border-color: var(--accentBorder); }
.pill-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }

.results-count { font-size: 12px; color: var(--text3); margin-bottom: 12px; }
.results-count span { color: var(--text); font-weight: 600; }

/* ── Job Cards ── */
.job-list { display: flex; flex-direction: column; gap: 6px; }
.job-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  padding: 15px 18px; cursor: pointer; transition: all 0.15s;
}
.job-card:hover { border-color: var(--border2); background: var(--surface2); }
.job-top { display: flex; gap: 12px; align-items: flex-start; }
.job-avatar {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff;
}
.job-info { flex: 1; min-width: 0; }
.job-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
.job-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.job-meta .remote { color: var(--green); font-size: 10px; font-weight: 600; margin-left: 6px; }

.job-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }

/* Match Score */
.match-badge {
  display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px;
  border-radius: 5px; font-size: 10px; font-weight: 700;
}
.match-high { background: var(--greenBg); color: var(--green); }
.match-med { background: var(--yellowBg); color: var(--yellow); }
.match-low { background: var(--redBg); color: var(--red); }
.match-none { background: var(--surface3); color: var(--text3); }

/* Visa Badge */
.visa-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: 600; }
.visa-yes { background: var(--greenBg); color: var(--green); }
.visa-no { background: var(--redBg); color: var(--red); }
.visa-unknown { background: var(--surface3); color: var(--text3); }

/* Pay Range */
.pay-badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: 600; background: var(--accentBg); color: var(--accent); }

.job-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--surface3); color: var(--text2); font-weight: 500; }
.job-time { font-size: 11px; color: var(--text3); flex-shrink: 0; }

/* Expanded card */
.job-detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text2); line-height: 1.6; }
.job-detail p { margin-bottom: 10px; max-height: 120px; overflow: hidden; }
.job-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.status-btn {
  padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
  background: transparent; color: var(--text3); border: 1px solid var(--border);
  cursor: pointer; text-transform: capitalize; font-family: inherit; transition: all 0.15s;
}
.status-btn:hover { border-color: var(--border2); color: var(--text2); }
.status-btn.active { background: var(--accentBg); color: var(--accent); border-color: var(--accentBorder); }
.job-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 500; margin-left: auto; }
.job-link:hover { text-decoration: underline; }

.tailor-btn {
  padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
  background: var(--purpleBg); color: var(--purple); border: 1px solid rgba(192,132,252,0.2);
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.tailor-btn:hover { background: rgba(192,132,252,0.15); }

/* Match details */
.match-detail {
  margin-top: 8px; padding: 10px 12px; background: var(--surface3); border-radius: 8px;
  font-size: 11px; color: var(--text2); line-height: 1.5;
}
.match-detail strong { color: var(--text); }
.match-detail .match-hits { color: var(--green); }
.match-detail .match-gaps { color: var(--yellow); }

/* ── Tailor Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto; padding: 24px;
}
.modal-title { font-size: 16px; font-weight: 700; font-family: 'Instrument Serif', Georgia, serif; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 16px; }
.modal-section { margin-bottom: 16px; }
.modal-section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.modal-textarea {
  width: 100%; min-height: 200px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; color: var(--text); font-size: 12px; line-height: 1.6;
  resize: vertical; outline: none; font-family: 'DM Sans', monospace;
}
.modal-textarea:focus { border-color: var(--accentBorder); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btn {
  padding: 8px 18px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.modal-btn-primary { background: var(--accent); color: var(--bg); border: none; }
.modal-btn-primary:hover { background: var(--accent2); }
.modal-btn-secondary { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.modal-btn-secondary:hover { border-color: var(--border2); }
.modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Stats ── */
.stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; flex: 1; min-width: 130px; }
.stat-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; font-family: 'Instrument Serif', Georgia, serif; }
.stat-sub { font-size: 11px; margin-top: 2px; font-weight: 500; }

/* ── Kanban ── */
.kanban { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 16px; }
.kanban-col { flex: 1; min-width: 210px; max-width: 260px; }
.kanban-header { display: flex; align-items: center; gap: 7px; padding: 0 4px; margin-bottom: 8px; }
.kanban-dot { width: 8px; height: 8px; border-radius: 50%; }
.kanban-label { font-size: 12px; font-weight: 600; }
.kanban-count { font-size: 10px; font-weight: 600; color: var(--text3); background: var(--surface3); border-radius: 4px; padding: 1px 6px; }
.kanban-body {
  background: var(--surface2); border-radius: 10px; padding: 6px;
  border: 1px solid var(--border); min-height: 200px; max-height: 500px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 5px;
}
.kanban-body .job-card { padding: 10px 12px; }
.kanban-body .job-title { font-size: 12px; }
.kanban-body .job-meta { font-size: 11px; }
.kanban-empty { padding: 20px; text-align: center; color: var(--text3); font-size: 12px; }

.page-title { font-size: 20px; font-weight: 700; font-family: 'Instrument Serif', Georgia, serif; margin-bottom: 4px; }
.page-sub { font-size: 12px; color: var(--text3); margin-bottom: 18px; }

/* ── Source Table ── */
.source-table { width: 100%; border-collapse: collapse; }
.source-table th { text-align: left; font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.source-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
.source-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.source-badge.success { background: var(--greenBg); color: var(--green); }
.source-badge.error { background: var(--redBg); color: var(--red); }

.loading { text-align: center; padding: 60px; color: var(--text3); }
.loading-spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: var(--redBg); border: 1px solid rgba(248,113,113,0.2); border-radius: 10px; padding: 16px 20px; color: var(--red); font-size: 13px; }
.empty-state { text-align: center; padding: 60px; color: var(--text3); background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
.empty-state .icon { font-size: 28px; opacity: 0.3; margin-bottom: 10px; }
.empty-state .title { font-size: 14px; font-weight: 500; }
.empty-state .sub { font-size: 12px; margin-top: 4px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease-out; }

/* Progress bar */
.progress-bar { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.progress-fill { height: 100%; background: var(--purple); border-radius: 2px; transition: width 0.3s; }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🌸</div>
      <div>
        <div class="logo-text">Pollen</div>
        <div class="logo-sub">AI / Tech / Data PM Tracker</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="search" onclick="switchTab('search')">🔍 Search</button>
      <button class="tab" data-tab="kanban" onclick="switchTab('kanban')">📋 Pipeline</button>
      <button class="tab" data-tab="stats" onclick="switchTab('stats')">📊 Analytics</button>
      <button class="tab" data-tab="sources" onclick="switchTab('sources')">⚙️ Sources</button>
    </div>
    <div class="status-dot" id="statusDot">Loading...</div>
  </header>

  <main>
    <!-- SEARCH TAB -->
    <div id="tab-search" class="tab-content fade-in">
      <!-- Resume upload bar -->
      <div class="resume-bar">
        <label>📄 Resume</label>
        <input type="file" id="resumeFile" accept=".txt,.pdf,.md,.doc,.docx" style="display:none" onchange="handleResumeUpload(event)">
        <button class="resume-upload-btn" onclick="document.getElementById('resumeFile').click()" id="uploadBtn">Upload Resume</button>
        <span class="resume-name" id="resumeName"></span>
        <button class="score-all-btn" id="scoreAllBtn" onclick="scoreAllJobs()" disabled>⚡ Score All Jobs</button>
        <span class="resume-status" id="resumeStatus"></span>
      </div>

      <div class="search-row">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="Search roles, companies..." oninput="debounceSearch()">
        </div>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
          <option value="newest">Newest first</option>
          <option value="match">Best match</option>
          <option value="salary">Highest pay</option>
          <option value="company">Company A→Z</option>
        </select>
      </div>
      <div class="filters" id="filters"></div>
      <div class="results-count" id="resultsCount"></div>
      <div class="job-list" id="jobList"></div>
    </div>

    <!-- KANBAN TAB -->
    <div id="tab-kanban" class="tab-content fade-in" style="display:none;">
      <div class="page-title">Application Pipeline</div>
      <div class="page-sub">Drag jobs between columns or click to change status</div>
      <div class="kanban" id="kanbanBoard"></div>
    </div>

    <!-- STATS TAB -->
    <div id="tab-stats" class="tab-content fade-in" style="display:none;">
      <div class="page-title">Analytics</div>
      <div class="page-sub">Your job search at a glance</div>
      <div id="statsContent"></div>
    </div>

    <!-- SOURCES TAB -->
    <div id="tab-sources" class="tab-content fade-in" style="display:none;">
      <div class="page-title">Crawl Sources</div>
      <div class="page-sub">Status of each scraper run</div>
      <div id="sourcesContent"></div>
    </div>
  </main>
</div>

<!-- Tailor Resume Modal -->
<div id="tailorModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeTailorModal()">
  <div class="modal">
    <div class="modal-title" id="tailorTitle">Tailor Resume</div>
    <div class="modal-sub" id="tailorSub">Optimizing for: ...</div>
    <div class="modal-section">
      <div class="modal-section-title">Tailored Resume</div>
      <textarea class="modal-textarea" id="tailoredResume" placeholder="Click 'Generate' to create a tailored version..."></textarea>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Key Changes Made</div>
      <div id="tailorChanges" style="font-size:12px;color:var(--text2);line-height:1.6;min-height:40px;"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="closeTailorModal()">Close</button>
      <button class="modal-btn modal-btn-secondary" onclick="copyTailoredResume()">📋 Copy</button>
      <button class="modal-btn modal-btn-primary" id="generateTailorBtn" onclick="generateTailoredResume()">✨ Generate</button>
    </div>
  </div>
</div>

<script>
// ── Config ──
const API = 'http://localhost:8000';
const ANTHROPIC_PROXY = null; // Set if you have a proxy for client-side Claude calls
let allJobs = [];
let filteredJobs = [];
let currentTab = 'search';
let activeFilters = { remote: false, visa: '', location: '', level: '', source: '' };
let expandedJobId = null;
let searchTimeout = null;
let resumeText = '';
let matchScores = {}; // jobId -> { score, hits, gaps, summary }
let visaStatus = {}; // jobId -> 'yes' | 'no' | 'unknown'
let scoringInProgress = false;
let tailorJobId = null;

const COLORS = ['#6EE7B7','#60A5FA','#FACC15','#F87171','#C084FC','#FB923C','#22D3EE','#A78BFA','#F472B6','#34D399'];
const KANBAN_COLS = [
  { key: 'new', label: 'New', color: '#9494A0' },
  { key: 'saved', label: 'Saved', color: '#C084FC' },
  { key: 'applied', label: 'Applied', color: '#60A5FA' },
  { key: 'interviewing', label: 'Interviewing', color: '#FACC15' },
  { key: 'offer', label: 'Offer', color: '#4ADE80' },
  { key: 'rejected', label: 'Rejected', color: '#F87171' },
];
const STATUSES = KANBAN_COLS.map(c => c.key);

function companyColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}
function daysAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return '1d ago';
  return diff + 'd ago';
}
function salaryStr(job) {
  if (job.salary_min && job.salary_max) return `$${Math.round(job.salary_min/1000)}k – $${Math.round(job.salary_max/1000)}k`;
  if (job.salary_min) return `$${Math.round(job.salary_min/1000)}k+`;
  if (job.salary_max) return `Up to $${Math.round(job.salary_max/1000)}k`;
  return '';
}
function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

// ── Visa Sponsorship Detection ──
function detectVisa(description) {
  if (!description) return 'unknown';
  const d = description.toLowerCase();

  // Positive signals
  const yesPatterns = [
    'visa sponsorship is available', 'visa sponsorship available',
    'will sponsor', 'we sponsor', 'sponsorship is provided', 'sponsorship provided',
    'sponsor qualified candidates', 'sponsor work visa', 'sponsor h-1b', 'sponsor h1b',
    'open to sponsoring', 'willing to sponsor', 'provide sponsorship',
    'immigration sponsorship available', 'work authorization sponsorship',
  ];
  // Negative signals
  const noPatterns = [
    'unable to sponsor', 'not able to sponsor', 'cannot sponsor', 'will not sponsor',
    'does not sponsor', 'do not sponsor', 'not sponsor', 'no sponsorship',
    'not provide sponsorship', 'without sponsorship', 'no visa sponsorship',
    'not offer visa', 'must be authorized to work', 'must be legally authorized',
    'must have work authorization', 'work authorization required',
    'without the need for sponsorship', 'not eligible for sponsorship',
    'must be a u.s. citizen', 'u.s. citizenship required', 'us citizen',
    'permanent resident required', 'green card required',
    'not provide immigration', 'unable to provide immigration',
  ];

  for (const p of yesPatterns) { if (d.includes(p)) return 'yes'; }
  for (const p of noPatterns) { if (d.includes(p)) return 'no'; }
  return 'unknown';
}

// ── Resume Handling ──
async function handleResumeUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  document.getElementById('resumeName').textContent = file.name;
  document.getElementById('resumeStatus').textContent = 'Reading...';

  try {
    if (file.name.endsWith('.pdf')) {
      // For PDFs, try to read as text (works for text-based PDFs)
      const arrayBuffer = await file.arrayBuffer();
      const bytes = new Uint8Array(arrayBuffer);
      let text = '';
      // Simple PDF text extraction — look for text between parentheses
      const str = new TextDecoder('latin1').decode(bytes);
      const matches = str.match(/\(([^)]+)\)/g);
      if (matches) {
        text = matches.map(m => m.slice(1, -1)).join(' ');
      }
      if (text.length < 50) {
        // Fallback: read raw
        text = await file.text();
      }
      resumeText = text;
    } else {
      resumeText = await file.text();
    }

    document.getElementById('resumeStatus').textContent = `${resumeText.length} chars loaded`;
    document.getElementById('scoreAllBtn').disabled = false;
    document.getElementById('uploadBtn').textContent = '📄 Change';

    // Auto-detect visa for all jobs
    allJobs.forEach(job => {
      visaStatus[job.id] = detectVisa(job.description);
    });

    render();
  } catch (e) {
    document.getElementById('resumeStatus').textContent = 'Error reading file';
    console.error(e);
  }
}

// ── Resume Match Scoring (Local keyword-based) ──
function scoreJobMatch(job) {
  if (!resumeText) return null;

  const resume = resumeText.toLowerCase();
  const title = (job.title || '').toLowerCase();
  const desc = (job.description || '').toLowerCase();
  const jobText = title + ' ' + desc;

  // Extract key terms from resume
  const resumeTerms = new Set();
  const skillPatterns = [
    'product management', 'product manager', 'product strategy', 'product roadmap',
    'agile', 'scrum', 'kanban', 'jira', 'confluence',
    'sql', 'python', 'javascript', 'typescript', 'react', 'node',
    'machine learning', 'ai', 'artificial intelligence', 'llm', 'nlp', 'computer vision',
    'deep learning', 'neural network', 'generative ai', 'genai',
    'data analysis', 'data science', 'analytics', 'a/b test', 'experimentation',
    'user research', 'customer discovery', 'market research',
    'api', 'sdk', 'microservices', 'cloud', 'aws', 'gcp', 'azure',
    'kubernetes', 'docker', 'ci/cd', 'devops',
    'stakeholder management', 'cross-functional', 'leadership',
    'okr', 'kpi', 'metrics', 'roi',
    'b2b', 'b2c', 'saas', 'enterprise', 'platform',
    'figma', 'tableau', 'looker', 'mixpanel', 'amplitude',
    'tensorflow', 'pytorch', 'spark', 'hadoop', 'snowflake', 'databricks',
    'growth', 'monetization', 'pricing', 'go-to-market', 'gtm',
    'fintech', 'healthtech', 'edtech', 'cybersecurity',
    'mobile', 'ios', 'android',
    'privacy', 'compliance', 'gdpr', 'hipaa',
    'mba', 'stanford', 'mit', 'carnegie mellon', 'berkeley',
    'series a', 'series b', 'startup', 'scale-up',
    'six sigma', 'lean', 'design thinking',
  ];

  const hits = [];
  const gaps = [];

  skillPatterns.forEach(skill => {
    const inResume = resume.includes(skill);
    const inJob = jobText.includes(skill);
    if (inResume && inJob) hits.push(skill);
    else if (!inResume && inJob) gaps.push(skill);
  });

  // Calculate score
  const totalRelevant = hits.length + gaps.length;
  if (totalRelevant === 0) return { score: 50, hits: [], gaps: [], summary: 'Limited overlap data' };

  let score = Math.round((hits.length / totalRelevant) * 100);

  // Bonus for title match
  const titleWords = title.split(/\s+/);
  const titleMatches = titleWords.filter(w => resume.includes(w) && w.length > 3).length;
  score = Math.min(99, score + titleMatches * 3);

  return {
    score,
    hits: hits.slice(0, 8),
    gaps: gaps.slice(0, 6),
    summary: score >= 80 ? 'Strong match' : score >= 60 ? 'Good match' : score >= 40 ? 'Partial match' : 'Weak match'
  };
}

function scoreAllJobs() {
  if (!resumeText || scoringInProgress) return;
  scoringInProgress = true;

  const btn = document.getElementById('scoreAllBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Scoring...';

  let i = 0;
  const total = allJobs.length;

  function scoreNext() {
    if (i >= total) {
      scoringInProgress = false;
      btn.textContent = `✅ ${total} scored`;
      document.getElementById('resumeStatus').textContent = `${total} jobs scored`;
      applyFilters();
      return;
    }

    const job = allJobs[i];
    matchScores[job.id] = scoreJobMatch(job);
    visaStatus[job.id] = detectVisa(job.description);
    i++;

    if (i % 10 === 0 || i === total) {
      btn.textContent = `⏳ ${i}/${total}`;
      render();
    }

    requestAnimationFrame(scoreNext);
  }

  scoreNext();
}

// ── API ──
async function fetchJobs() {
  try {
    // Paginate to get ALL jobs (API max is 200 per request)
    let offset = 0;
    const batchSize = 200;
    allJobs = [];
    let total = Infinity;

    while (offset < total) {
      const r = await fetch(`${API}/api/jobs?limit=${batchSize}&offset=${offset}&order_by=newest`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      total = data.total;
      allJobs.push(...(data.jobs || []));
      offset += batchSize;
      document.getElementById('statusDot').textContent = `Loading... ${allJobs.length}/${total}`;
    }

    document.getElementById('statusDot').textContent = `${allJobs.length} jobs loaded`;

    // Auto-detect visa for all
    allJobs.forEach(job => { visaStatus[job.id] = detectVisa(job.description); });

    applyFilters();
    renderFilters();
  } catch (e) {
    document.getElementById('statusDot').textContent = 'API offline';
    document.getElementById('jobList').innerHTML = `
      <div class="error-msg">
        <strong>Cannot connect to API</strong><br>
        Make sure the server is running: <code>uvicorn api.server:app --reload --port 8000</code>
      </div>`;
  }
}
async function fetchStats() { try { return await (await fetch(`${API}/api/stats`)).json(); } catch { return null; } }
async function fetchSources() { try { return await (await fetch(`${API}/api/sources`)).json(); } catch { return []; } }

async function updateJobStatus(jobId, status) {
  try {
    await fetch(`${API}/api/jobs/${jobId}/status`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status}) });
    const job = allJobs.find(j => j.id === jobId);
    if (job) job.status = status;
    render();
  } catch (e) { console.error('Status update failed:', e); }
}

// ── Filters ──
function renderFilters() {
  const locations = [...new Set(allJobs.map(j => j.location).filter(Boolean))].slice(0, 6);
  const levels = [...new Set(allJobs.map(j => j.level).filter(Boolean))];
  const sources = [...new Set(allJobs.map(j => j.source).filter(Boolean))];
  let html = '';
  html += `<button class="pill ${activeFilters.remote ? 'active' : ''}" onclick="toggleFilter('remote')">🌍 Remote</button>`;
  html += `<button class="pill ${activeFilters.visa === 'yes' ? 'active' : ''}" onclick="toggleFilter('visa','yes')">✅ Sponsors Visa</button>`;
  html += `<button class="pill ${activeFilters.visa === 'no' ? 'active' : ''}" onclick="toggleFilter('visa','no')">🚫 No Visa</button>`;
  html += '<div class="pill-sep"></div>';
  locations.forEach(loc => {
    html += `<button class="pill ${activeFilters.location === loc ? 'active' : ''}" onclick="toggleFilter('location','${loc.replace(/'/g,"\\'")}')">${loc}</button>`;
  });
  if (levels.length) {
    html += '<div class="pill-sep"></div>';
    levels.forEach(lv => { html += `<button class="pill ${activeFilters.level === lv ? 'active' : ''}" onclick="toggleFilter('level','${lv}')">${lv}</button>`; });
  }
  if (sources.length) {
    html += '<div class="pill-sep"></div>';
    sources.forEach(s => { html += `<button class="pill ${activeFilters.source === s ? 'active' : ''}" onclick="toggleFilter('source','${s}')">${s}</button>`; });
  }
  if (Object.values(activeFilters).some(v => v)) {
    html += `<button style="font-size:11px;color:#F87171;background:none;border:none;cursor:pointer;font-weight:500;font-family:inherit;" onclick="clearFilters()">Clear all</button>`;
  }
  document.getElementById('filters').innerHTML = html;
}
function toggleFilter(key, value) {
  if (key === 'remote') activeFilters.remote = !activeFilters.remote;
  else if (key === 'visa') activeFilters.visa = activeFilters.visa === value ? '' : value;
  else activeFilters[key] = activeFilters[key] === value ? '' : value;
  applyFilters(); renderFilters();
}
function clearFilters() {
  activeFilters = { remote: false, visa: '', location: '', level: '', source: '' };
  applyFilters(); renderFilters();
}
function applyFilters() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  filteredJobs = allJobs.filter(j => {
    if (q && !j.title.toLowerCase().includes(q) && !j.company_name.toLowerCase().includes(q)) return false;
    if (activeFilters.remote && !j.remote) return false;
    if (activeFilters.visa && visaStatus[j.id] !== activeFilters.visa) return false;
    if (activeFilters.location && j.location !== activeFilters.location) return false;
    if (activeFilters.level && j.level !== activeFilters.level) return false;
    if (activeFilters.source && j.source !== activeFilters.source) return false;
    return true;
  });
  // Sort
  const sort = document.getElementById('sortSelect')?.value || 'newest';
  if (sort === 'match') filteredJobs.sort((a,b) => (matchScores[b.id]?.score || 0) - (matchScores[a.id]?.score || 0));
  else if (sort === 'salary') filteredJobs.sort((a,b) => (b.salary_max || b.salary_min || 0) - (a.salary_max || a.salary_min || 0));
  else if (sort === 'company') filteredJobs.sort((a,b) => a.company_name.localeCompare(b.company_name));
  else filteredJobs.sort((a,b) => new Date(b.first_seen_at || 0) - new Date(a.first_seen_at || 0));
  render();
}
function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => applyFilters(), 200); }

    // Pay badge
    const payHtml = salary ? `<span class="pay-badge">💰 ${salary}</span>` : '';

    return `

  }
}

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:10px;height:10px;border-radius:50%;background:var(--green)"></div>
          <span style="font-size:12px;flex:1;color:var(--text2)">Sponsors Visa</span>
          <span style="font-size:12px;font-weight:600">${visaYes}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:10px;height:10px;border-radius:50%;background:var(--red)"></div>
          <span style="font-size:12px;flex:1;color:var(--text2)">No Sponsorship</span>
          <span style="font-size:12px;font-weight:600">${visaNo}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:10px;height:10px;border-radius:50%;background:var(--text3)"></div>
          <span style="font-size:12px;flex:1;color:var(--text2)">Not Mentioned</span>
          <span style="font-size:12px;font-weight:600">${visaUnknown}</span>
        </div>
      </div>
    </div>`;
}

// ── Sources ──
async function renderSources() {
  const el = document.getElementById('sourcesContent');
  el.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading sources...</div>';
  const sources = await fetchSources();
  if (!sources.length) {
    el.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:12px;">
      <p style="font-size:13px;color:var(--text2);">No crawl logs yet.</p>
      <code style="display:block;margin-top:8px;padding:10px;background:var(--surface3);border-radius:6px;font-size:12px;color:var(--accent);">python run_crawl.py --source greenhouse</code>
    </div>`;
    return;
  }
  el.innerHTML = `<table class="source-table" style="margin-top:12px;">
    <thead><tr><th>Source</th><th>Company</th><th>Status</th><th>Jobs Found</th><th>New</th><th>Time</th></tr></thead>
    <tbody>${sources.map(s => `<tr>
      <td>${esc(s.source)}</td><td>${esc(s.company || '—')}</td>
      <td><span class="source-badge ${s.status === 'success' ? 'success' : 'error'}">${s.status}</span></td>
      <td>${s.jobs_found}</td><td style="color:var(--accent);font-weight:600;">${s.jobs_new}</td>
      <td style="color:var(--text3);font-size:12px;">${s.started_at ? new Date(s.started_at).toLocaleString() : '—'}</td>
    </tr>`).join('')}</tbody></table>`;
}

// ── Init ──
fetchJobs();
</script>
</body>
</html>
